[project]
name = "agentic-ecos"
version = "0.1.0"
description = "MCP server que porta infraestructura agéntica a cualquier proyecto del ecosistema"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.27.0,<2.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agentic-ecos = "agentic_ecos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_ecos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
